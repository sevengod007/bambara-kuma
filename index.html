<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bambara Kuma</title>
<style>
  :root {
    --bg: #0D1117; --surface: #161B22; --border: #21262D;
    --accent: #D4A017; --accent2: #C4703A;
    --text: #E6EDF3; --muted: #7D8590;
    --green: #3FB950; --red: #F85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    max-width: 480px; margin: 0 auto;
  }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 16px; display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 10;
  }
  .logo {
    width: 36px; height: 36px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .logo-text h1 { font-size: 16px; font-weight: 600; }
  .logo-text p { font-size: 11px; color: var(--muted); }

  .tabs {
    display: flex; background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1; padding: 11px 8px; text-align: center;
    font-size: 13px; font-weight: 500; color: var(--muted);
    cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  /* Lang selector */
  .lang-row { display: flex; gap: 8px; }
  .lang-btn {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px; color: var(--text);
    font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
    transition: all .2s;
  }
  .lang-btn.active { border-color: var(--accent); color: var(--accent); }

  /* Input */
  .input-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }
  .input-box textarea {
    width: 100%; background: transparent; border: none;
    color: var(--text); font-family: inherit; font-size: 16px;
    line-height: 1.6; padding: 14px; resize: none; outline: none; min-height: 110px;
  }
  .input-box textarea::placeholder { color: #2d3748; }
  .input-footer {
    display: flex; align-items: center;
    padding: 8px 10px; border-top: 1px solid var(--border); gap: 8px;
  }
  .char-count { font-size: 11px; color: var(--muted); margin-left: auto; }

  /* Buttons */
  .icon-btn {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 7px; width: 34px; height: 34px;
    color: var(--muted); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .2s;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn.recording { border-color: var(--red); color: var(--red); animation: blink .7s infinite; }
  .icon-btn.playing { border-color: var(--green); color: var(--green); }

  .translate-btn {
    width: 100%; border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600;
    padding: 13px; cursor: pointer; transition: opacity .2s;
  }
  .translate-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Output */
  .output-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }
  .output-label {
    font-size: 11px; color: var(--muted);
    padding: 10px 14px 0; text-transform: uppercase; letter-spacing: .8px;
  }
  .output-text {
    padding: 10px 14px 14px; font-size: 17px; line-height: 1.6;
    min-height: 60px; white-space: pre-wrap;
  }
  .output-text.empty { color: #2d3748; font-style: italic; font-size: 14px; }
  .output-text.loading { color: var(--muted); }
  .output-footer {
    display: flex; align-items: center;
    padding: 8px 10px; border-top: 1px solid var(--border); gap: 8px;
  }

  /* ASR mode */
  .mic-big-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0;
  }
  .mic-big {
    width: 76px; height: 76px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--border);
    color: var(--muted); font-size: 30px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .25s;
  }
  .mic-big.recording {
    background: var(--accent2); border-color: var(--accent2); color: #fff;
    animation: pulse 1.2s ease infinite;
  }
  .mic-big-label { font-size: 13px; color: var(--muted); text-align: center; }
  .mic-big-label.active { color: var(--accent2); }

  .asr-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .asr-section-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
  .asr-bm { font-size: 16px; color: var(--text); min-height: 22px; }
  .asr-divider { height: 1px; background: var(--border); }
  .asr-fr { font-size: 15px; color: #58A6FF; min-height: 22px; }
  .asr-footer { display: flex; gap: 8px; padding-top: 4px; }

  /* Status */
  .status {
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 16px; display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .dot.error { background: var(--red); }
  .dot.busy { background: var(--accent); animation: blink .7s infinite; }

  .toast {
    position: fixed; bottom: 56px; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #333; color: #fff; padding: 8px 16px;
    border-radius: 20px; font-size: 13px; opacity: 0;
    transition: all .3s; pointer-events: none; white-space: nowrap; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hidden { display: none !important; }

  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(196,112,58,.5); }
    50% { box-shadow: 0 0 0 14px rgba(196,112,58,0); }
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
</style>
</head>
<body>

<header>
  <div class="logo">🌍</div>
  <div class="logo-text">
    <h1>Bambara Kuma</h1>
    <p>Traduction Bambara · Djelia AI</p>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('speak')">🗣 Je parle</div>
  <div class="tab" onclick="switchTab('listen')">👂 Il parle</div>
</div>

<div class="main">

  <!-- TAB: SPEAK (FR/EN → Bambara) -->
  <div id="tab-speak">
    <div class="lang-row">
      <button class="lang-btn active" id="btn-fr" onclick="setLang('fr')">Français</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">English</button>
    </div>

    <div class="input-box">
      <textarea id="input-text" placeholder="Écrivez ou parlez…" oninput="updateCount()" rows="4"></textarea>
      <div class="input-footer">
        <button class="icon-btn" id="mic-in-btn" onclick="toggleInputMic()" title="Voix">🎙</button>
        <button class="icon-btn" onclick="clearAll()" title="Effacer">✕</button>
        <span class="char-count" id="char-count">0</span>
      </div>
    </div>

    <button class="translate-btn" id="translate-btn" onclick="doTranslate()">
      Traduire en Bamanankan
    </button>

    <div class="output-box">
      <div class="output-label">Bamanankan</div>
      <div class="output-text empty" id="output-text">La traduction apparaîtra ici…</div>
      <div class="output-footer">
        <button class="icon-btn" id="tts-btn" onclick="doTTS()" title="Écouter">🔊</button>
        <button class="icon-btn" onclick="copyOutput()" title="Copier">📋</button>
      </div>
    </div>
  </div>

  <!-- TAB: LISTEN (Bambara → FR/EN) -->
  <div id="tab-listen" class="hidden">
    <div class="lang-row">
      <button class="lang-btn active" id="btn-asr-fr" onclick="setAsrLang('fr')">→ Français</button>
      <button class="lang-btn" id="btn-asr-en" onclick="setAsrLang('en')">→ English</button>
    </div>

    <div class="mic-big-wrap">
      <button class="mic-big" id="asr-mic" onclick="toggleAsrMic()">🎙</button>
      <div class="mic-big-label" id="asr-label">Appuyez pour enregistrer le locuteur Bambara</div>
    </div>

    <div class="asr-box">
      <div class="asr-section-label">Bamanankan (reconnu)</div>
      <div class="asr-bm" id="asr-bm">—</div>
      <div class="asr-divider"></div>
      <div class="asr-section-label" id="asr-tgt-label">Traduction française</div>
      <div class="asr-fr" id="asr-tgt">—</div>
      <div class="asr-footer">
        <button class="icon-btn" id="asr-tts-btn" onclick="doAsrTTS()" title="Réécouter Bambara">🔊</button>
        <button class="icon-btn" onclick="copyAsr()" title="Copier">📋</button>
      </div>
    </div>
  </div>

</div>

<div class="status">
  <div class="dot" id="dot"></div>
  <span id="status-text">Prêt · Djelia AI</span>
</div>

<div class="toast" id="toast"></div>

<script>
const API_KEY = '02388ac6-753f-4c6d-b5ca-2f08e0985181';
const BASE = 'https://djelia.cloud/api/v1/models';

let tab = 'speak';
let srcLang = 'fr';
let asrLang = 'fr';
let bambaraResult = '';
let asrBambaraText = '';
let currentAudio = null;
let inputRecognition = null;
let isInputListening = false;
let asrRecorder = null;
let asrChunks = [];
let isAsrRecording = false;

// ── UI helpers ────────────────────────────────────────
function setStatus(state, msg) {
  document.getElementById('dot').className = 'dot' + (state !== 'ok' ? ' ' + state : '');
  document.getElementById('status-text').textContent = msg;
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}
function switchTab(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach((el, i) => el.classList.toggle('active', (i===0&&t==='speak')||(i===1&&t==='listen')));
  document.getElementById('tab-speak').classList.toggle('hidden', t !== 'speak');
  document.getElementById('tab-listen').classList.toggle('hidden', t !== 'listen');
}
function setLang(l) {
  srcLang = l;
  document.getElementById('btn-fr').classList.toggle('active', l === 'fr');
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('input-text').placeholder = l === 'fr' ? 'Écrivez ou parlez…' : 'Type or speak…';
}
function setAsrLang(l) {
  asrLang = l;
  document.getElementById('btn-asr-fr').classList.toggle('active', l === 'fr');
  document.getElementById('btn-asr-en').classList.toggle('active', l === 'en');
  document.getElementById('asr-tgt-label').textContent = l === 'fr' ? 'Traduction française' : 'English translation';
}
function clearAll() {
  document.getElementById('input-text').value = '';
  document.getElementById('output-text').textContent = 'La traduction apparaîtra ici…';
  document.getElementById('output-text').className = 'output-text empty';
  bambaraResult = '';
  updateCount();
}
function updateCount() {
  document.getElementById('char-count').textContent = document.getElementById('input-text').value.length;
}
function copyOutput() {
  if (bambaraResult) { navigator.clipboard.writeText(bambaraResult); toast('Copié ✓'); }
}
function copyAsr() {
  const t = document.getElementById('asr-tgt').textContent;
  if (t && t !== '—') { navigator.clipboard.writeText(t); toast('Copié ✓'); }
}

// ── Translate FR/EN → Bambara ─────────────────────────
async function doTranslate() {
  const text = document.getElementById('input-text').value.trim();
  if (!text) return;

  const btn = document.getElementById('translate-btn');
  btn.disabled = true;
  btn.textContent = '…';
  document.getElementById('output-text').textContent = 'Traduction en cours…';
  document.getElementById('output-text').className = 'output-text loading';
  setStatus('busy', 'Traduction…');

  const srcCode = srcLang === 'fr' ? 'fra_Latn' : 'eng_Latn';

  try {
    const r = await fetch(`${BASE}/translate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
      body: JSON.stringify({ text, source: srcCode, target: 'bam_Latn' })
    });
    if (!r.ok) throw new Error((await r.text()).slice(0, 120));
    const d = await r.json();
    bambaraResult = d.translation || d.text || d.result || JSON.stringify(d);
    document.getElementById('output-text').textContent = bambaraResult;
    document.getElementById('output-text').className = 'output-text';
    setStatus('ok', 'Traduction terminée');
  } catch(e) {
    document.getElementById('output-text').textContent = 'Erreur : ' + e.message;
    document.getElementById('output-text').className = 'output-text empty';
    setStatus('error', e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Traduire en Bamanankan';
  }
}

// ── TTS (Bambara → audio) ─────────────────────────────
async function playTTS(text, btnEl) {
  if (!text) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; btnEl.classList.remove('playing'); btnEl.textContent = '🔊'; return; }

  btnEl.textContent = '⏳';
  setStatus('busy', 'Génération audio…');

  try {
    const r = await fetch(`${BASE}/tts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
      body: JSON.stringify({ text, speaker: 'Moussa', model: 'v2' })
    });
    if (!r.ok) throw new Error('TTS ' + r.status + ': ' + (await r.text()).slice(0,100));
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    currentAudio = new Audio(url);
    btnEl.classList.add('playing'); btnEl.textContent = '⏹';
    setStatus('ok', 'Lecture…');
    currentAudio.onended = () => { btnEl.classList.remove('playing'); btnEl.textContent = '🔊'; currentAudio = null; setStatus('ok', 'Prêt · Djelia AI'); };
    await currentAudio.play();
  } catch(e) {
    btnEl.textContent = '🔊';
    setStatus('error', e.message);
    toast('Erreur audio : ' + e.message.slice(0,50));
  }
}
function doTTS() { playTTS(bambaraResult, document.getElementById('tts-btn')); }
function doAsrTTS() { playTTS(asrBambaraText, document.getElementById('asr-tts-btn')); }

// ── Voice input (FR/EN speech → text) ────────────────
function toggleInputMic() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) { toast('Utilisez Chrome pour la voix'); return; }
  if (isInputListening) { inputRecognition?.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  inputRecognition = new SR();
  inputRecognition.lang = srcLang === 'fr' ? 'fr-FR' : 'en-US';
  inputRecognition.interimResults = false;
  const btn = document.getElementById('mic-in-btn');
  inputRecognition.onstart = () => { isInputListening = true; btn.classList.add('recording'); btn.textContent = '🔴'; setStatus('busy', 'Enregistrement…'); };
  inputRecognition.onresult = e => { document.getElementById('input-text').value = e.results[0][0].transcript; updateCount(); };
  inputRecognition.onend = () => { isInputListening = false; btn.classList.remove('recording'); btn.textContent = '🎙'; setStatus('ok', 'Prêt'); const t = document.getElementById('input-text').value.trim(); if (t) doTranslate(); };
  inputRecognition.onerror = () => { isInputListening = false; btn.classList.remove('recording'); btn.textContent = '🎙'; setStatus('error', 'Erreur micro'); };
  inputRecognition.start();
}

// ── ASR: Record Bambara → Djelia transcribe → translate ──
async function toggleAsrMic() {
  if (isAsrRecording) { asrRecorder?.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    asrChunks = [];

    // Try formats in order of preference
    const mimeTypes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
    const mimeType = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || '';
    asrRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);

    const btn = document.getElementById('asr-mic');
    const label = document.getElementById('asr-label');

    asrRecorder.ondataavailable = e => { if (e.data.size > 0) asrChunks.push(e.data); };
    asrRecorder.onstart = () => {
      isAsrRecording = true; btn.classList.add('recording');
      label.textContent = '🔴 Enregistrement… Appuyez pour arrêter'; label.classList.add('active');
      setStatus('busy', 'Enregistrement…');
    };
    asrRecorder.onstop = async () => {
      isAsrRecording = false; btn.classList.remove('recording');
      label.textContent = 'Traitement…'; stream.getTracks().forEach(t => t.stop());
      const ext = (asrRecorder.mimeType || '').includes('ogg') ? 'ogg' : (asrRecorder.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(asrChunks, { type: asrRecorder.mimeType || 'audio/webm' });
      await processAsr(blob, ext);
      label.textContent = 'Appuyez pour enregistrer le locuteur Bambara'; label.classList.remove('active');
    };
    asrRecorder.start();
  } catch(e) {
    toast('Microphone inaccessible');
    setStatus('error', 'Permission micro refusée');
  }
}

async function processAsr(blob, ext) {
  setStatus('busy', 'Reconnaissance Bambara…');
  document.getElementById('asr-bm').textContent = 'Analyse…';
  document.getElementById('asr-tgt').textContent = '—';

  try {
    // Step 1: Djelia ASR — transcribe Bambara audio
    const form = new FormData();
    form.append('file', blob, `recording.${ext}`);
    const r1 = await fetch(`${BASE}/transcribe`, { method: 'POST', headers: { 'x-api-key': API_KEY }, body: form });
    if (!r1.ok) throw new Error('ASR ' + r1.status + ': ' + (await r1.text()).slice(0,100));
    const d1 = await r1.json();
    // Handle segment array or plain text
    asrBambaraText = Array.isArray(d1) ? d1.map(s => s.text).join(' ') : (d1.transcription || d1.text || d1.result || JSON.stringify(d1));
    document.getElementById('asr-bm').textContent = asrBambaraText;

    // Step 2: Djelia translate Bambara → FR or EN
    setStatus('busy', 'Traduction…');
    const tgtCode = asrLang === 'fr' ? 'fra_Latn' : 'eng_Latn';
    const r2 = await fetch(`${BASE}/translate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
      body: JSON.stringify({ text: asrBambaraText, source: 'bam_Latn', target: tgtCode })
    });
    if (!r2.ok) throw new Error('Traduction ' + r2.status);
    const d2 = await r2.json();
    const translated = d2.translation || d2.text || d2.result || '';
    document.getElementById('asr-tgt').textContent = translated;
    setStatus('ok', 'Terminé');
  } catch(e) {
    document.getElementById('asr-bm').textContent = 'Échec';
    document.getElementById('asr-tgt').textContent = e.message;
    setStatus('error', e.message);
  }
}

document.getElementById('input-text').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) doTranslate();
});
</script>
</body>
</html>
